aid: new-story
name: New Story
description: >-
  New Story is a US 501(c)(3) nonprofit building a housing market that helps
  vulnerable families in Latin America become homeowners. It develops underused
  land into affordable communities, enables families to own land, and connects
  them to credit and home financing. Founded in 2014 (Y Combinator W15), New
  Story has housed thousands of people across Haiti, Bolivia, Mexico, and El
  Salvador, partnered with ICON to build the first community of 3D-printed
  homes, and reports outcomes like 60% of land titles going to women and a 100%
  portfolio repayment rate. Its impact-investing arm operates as New Story
  Capital. This is a company profile in the API Evangelist network; New Story
  publishes no public developer or API surface.
